{% extends "base.html" %}
{% block content %}
<style>
    .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 20px;
        margin-top: 20px;
    }
    
    .agent-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        background: #f9f9f9;
        transition: box-shadow 0.2s;
    }
    
    .agent-card:hover {
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .agent-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    
    .agent-header h3 {
        margin: 0;
        font-size: 16px;
    }
    
    .status {
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
    }
    
    .status-online {
        background-color: #d4edda;
        color: #155724;
    }
    
    .status-offline {
        background-color: #f8d7da;
        color: #721c24;
    }
    
    .agent-info p {
        margin: 5px 0;
        font-size: 13px;
    }
    
    .agent-actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }
    
    .btn {
        padding: 8px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        text-decoration: none;
        display: inline-block;
    }
    
    .btn-primary {
        background-color: #007bff;
        color: white;
    }
    
    .btn-primary:hover {
        background-color: #0056b3;
    }
    
    .btn-success {
        background-color: #28a745;
        color: white;
    }
    
    .btn-success:hover {
        background-color: #218838;
    }
    
    .btn-small {
        padding: 5px 8px;
        font-size: 11px;
    }
    
    .details-section {
        background: white;
        border-radius: 8px;
        padding: 20px;
    }
    
    .details-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin: 15px 0;
    }
    
    .result-card, .log-entry {
        border-left: 4px solid #007bff;
        padding: 12px;
        margin-bottom: 10px;
        background: #f5f5f5;
        border-radius: 4px;
    }
    
    .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    
    .result-header h4 {
        margin: 0;
        font-size: 14px;
    }
    
    .time {
        font-size: 12px;
        color: #666;
    }
    
    .result-output {
        background: white;
        padding: 10px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        max-height: 300px;
        overflow-y: auto;
    }
    
    .result-output pre {
        margin: 0;
        white-space: pre-wrap;
        word-wrap: break-word;
    }
    
    .log-entry {
        border-left-color: #999;
        display: flex;
        gap: 10px;
        font-family: monospace;
        font-size: 12px;
    }
    
    .log-debug {
        border-left-color: #999;
    }
    
    .log-info {
        border-left-color: #17a2b8;
    }
    
    .log-warn {
        border-left-color: #ffc107;
        background-color: #fffbf0;
    }
    
    .log-error {
        border-left-color: #dc3545;
        background-color: #ffe6e6;
    }
    
    .log-time {
        color: #666;
        font-size: 11px;
        min-width: 180px;
    }
    
    .log-level {
        font-weight: bold;
        min-width: 60px;
    }
    
    .log-message {
        flex: 1;
    }
    
    .no-data {
        color: #999;
        font-style: italic;
        text-align: center;
        padding: 20px;
    }
</style>

<h1>JOCKY Control & Command Dashboard</h1>

<div class="dashboard-grid">
    <!-- Left Panel: Agent List -->
    <div class="details-section">
        <h2>Registered Agents</h2>
        <div id="agents-list"></div>
    </div>
    
    <!-- Right Panel: Agent Details -->
    <div>
        <!-- Agent Details -->
        <div class="details-section" id="agent-details">
            <p class="no-data">Select an agent to view details</p>
        </div>
        
        <!-- Results Section -->
        <div class="details-section" style="margin-top: 20px;">
            <h3>Recent Results</h3>
            <div id="results-container" class="no-data">No agent selected</div>
        </div>
        
        <!-- Logs Section -->
        <div class="details-section" style="margin-top: 20px;">
            <h3>Real-Time Logs</h3>
            <div id="logs-container" class="no-data">No agent selected</div>
        </div>
    </div>
</div>

<script src="/static/dashboard.js"></script>
{% endblock %}
